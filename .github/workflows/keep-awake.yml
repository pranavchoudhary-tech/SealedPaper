# Keeps the free-tier API and database awake.
# - Render's free plan sleeps after 15 idle minutes; while asleep the release worker cannot
#   release documents at their unlock time, and the first visitor waits about a minute.
# - Supabase pauses a free project after a week without activity. /api/health runs a query,
#   so every ping also counts as database activity.
# Setup: GitHub repo > Settings > Secrets and variables > Actions > Variables >
#        New variable  API_HEALTH_URL = https://<your-render-service>.onrender.com/api/health
# Without the variable this workflow does nothing. GitHub may delay scheduled runs by a few minutes.
name: Keep awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health check
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "API_HEALTH_URL is not set; nothing to do."; exit 0; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 "$URL"
